<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="入力テスト">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>iPad 入力テスト v1</title>
<!--
  イラレCAD：iPad と Apple Pencil の入力テスト（アプリ本体とは別のページ）
  確かめること
    ・ペン／指／手のひらの区別（ペンが触れている間は指を無視する）
    ・筆圧・傾き・点の細かさ（getCoalescedEvents）
    ・描いている途中の中断（pointercancel・lostpointercapture）
    ・指で動かす（1本）・拡大する（2本）。ページそのものは拡大・スクロールしない
    ・手描きの線をベジェにする（paper.js の simplify）と、自動で閉じる判定
    ・保存と読み込み（アプリ本体と同じやり方）、ホーム画面から開いたときの動き
-->
<style>
  :root { --bg: #f4f4f2; --panel: rgba(255,255,255,.92); --ink: #222; --sub: #666; --line: #ccc; --pen: #1565c0; --raw: #999; --finger: #2e7d32; --warn: #c62828; --close: #ef6c00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --panel: rgba(40,40,40,.92); --ink: #eee; --sub: #aaa; --line: #555; --pen: #64b5f6; --raw: #777; --finger: #81c784; --warn: #ef9a9a; --close: #ffb74d; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) 6px calc(env(safe-area-inset-left) + 8px);
    background: var(--panel); border-bottom: 1px solid var(--line); }
  #bar b { margin-right: 6px; }
  button, label.btn { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); }
  button:active { background: var(--line); }
  input[type=range] { width: 110px; vertical-align: middle; }
  #c { position: fixed; inset: 0; display: block; touch-action: none; }
  #info { position: fixed; z-index: 2; right: calc(env(safe-area-inset-right) + 8px); bottom: calc(env(safe-area-inset-bottom) + 8px);
    width: min(360px, calc(100vw - 16px)); max-height: 55vh; overflow: auto; padding: 8px 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; font-size: 12px; pointer-events: auto; touch-action: pan-y; }
  #info h4 { margin: 6px 0 2px; font-size: 12px; color: var(--sub); }
  #info table { border-collapse: collapse; width: 100%; }
  #info td { padding: 1px 4px; vertical-align: top; }
  #info td:first-child { color: var(--sub); white-space: nowrap; width: 9em; }
  #log div { border-top: 1px dotted var(--line); padding: 1px 0; }
  .warn { color: var(--warn); }
  #hide { position: absolute; right: 6px; top: 4px; padding: 2px 8px; }
  #info.min > :not(#hide):not(h4:first-of-type) { display: none; }
</style>
</head>
<body>
<div id="bar">
  <b>iPad 入力テスト v1</b>
  <button id="clear">消す</button>
  <span>なめらかさ <input id="tol" type="range" min="0" max="8" step="0.5" value="1"> <span id="tolv">1</span>px</span>
  <button id="raw">元の点：表示</button>
  <button id="save">保存テスト</button>
  <label class="btn">読み込みテスト<input id="load" type="file" accept=".icad,.json,application/json" hidden></label>
  <button id="copy">結果をコピー</button>
  <button id="reset">表示を戻す</button>
</div>
<canvas id="c"></canvas>
<div id="info">
  <button id="hide">小さく</button>
  <h4>いま触れているもの</h4>
  <table id="now"></table>
  <h4>最後の一筆（ペン）</h4>
  <table id="last"></table>
  <h4>合計</h4>
  <table id="total"></table>
  <h4>この端末</h4>
  <table id="env"></table>
  <h4>できごと</h4>
  <div id="log"></div>
</div>
<script src="js/vendor/paper-core.min.js?v=1"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
paper.setup(new paper.Size(10, 10));   // 画面には描かない。simplify を使うためだけ

// ---- 状態 ----
const view = { s: 1, tx: 0, ty: 0 };                 // 画面 = 世界 × s + t（指で動かす・拡大する）
const strokes = [];                                   // { raw: [{x,y,p}], segs: [...], closed }
let cur = null;                                       // 描いている途中の一筆
let penId = null;                                     // 線を引いているポインター（これだけが線を更新できる）
const touches = new Map();                            // 指（pointerId → {x, y}）
let gest = null;                                      // 指の操作の基準
let showRaw = true;
const T = { strokes: 0, closed: 0, cancelled: 0, ignoredTouch: 0, bigTouch: 0, maxTouchW: 0, maxTouches: 0, fingerOps: 0, events: 0, coalesced: 0, coalescedMax: 0, pressureSeen: false, tiltSeen: false, pageZoom: 0 };
let lastStroke = null;

const tolPx = () => +$('tol').value;
const toWorld = (x, y) => ({ x: (x - view.tx) / view.s, y: (y - view.ty) / view.s });
const toScr = (p) => ({ x: p.x * view.s + view.tx, y: p.y * view.s + view.ty });

function log(msg, warn) {
  const d = document.createElement('div');
  const t = new Date();
  d.textContent = `${t.toTimeString().slice(0, 8)} ${msg}`;
  if (warn) d.className = 'warn';
  $('log').prepend(d);
  while ($('log').children.length > 12) $('log').lastChild.remove();
}

// ---- 画面の大きさ ----
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  showEnv(); requestDraw();
}
addEventListener('resize', resize);

// ---- 描く（requestAnimationFrame にまとめる） ----
let drawQueued = false;
function requestDraw() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(draw); } }
function draw() {
  drawQueued = false;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const css = getComputedStyle(document.documentElement);
  const col = (n) => css.getPropertyValue(n).trim();
  // 方眼（拡大・移動が分かるように）
  ctx.strokeStyle = col('--line'); ctx.lineWidth = 0.5;
  const step = 50 * view.s;
  if (step > 8) {
    ctx.beginPath();
    for (let x = view.tx % step; x < innerWidth; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, innerHeight); }
    for (let y = view.ty % step; y < innerHeight; y += step) { ctx.moveTo(0, y); ctx.lineTo(innerWidth, y); }
    ctx.stroke();
  }
  for (const s of strokes) drawStroke(s, col);
  if (cur) {
    // 描いている途中：筆圧で太さを変えた元の線（確かめるためだけ。アプリでは太さは変えない予定）
    ctx.strokeStyle = col('--pen'); ctx.lineCap = 'round';
    for (let i = 1; i < cur.raw.length; i++) {
      const a = toScr(cur.raw[i - 1]), b = toScr(cur.raw[i]);
      ctx.lineWidth = 0.8 + 4 * (cur.raw[i].p || 0.5);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // 始点の近くに来たら「離すと閉じる」
    if (cur.raw.length) {
      const st = toScr(cur.raw[0]);
      ctx.strokeStyle = col('--close'); ctx.lineWidth = cur.willClose ? 3 : 1;
      ctx.beginPath(); ctx.arc(st.x, st.y, CLOSE_PX, 0, Math.PI * 2); ctx.stroke();
      if (cur.willClose) { ctx.fillStyle = col('--close'); ctx.fillText('離すと閉じる', st.x + CLOSE_PX + 4, st.y + 4); }
    }
  }
  // 指
  ctx.fillStyle = col('--finger');
  for (const t of touches.values()) { ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(t.x, t.y, Math.max(16, t.w / 2), 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function drawStroke(s, col) {
  if (showRaw) {
    ctx.fillStyle = col('--raw');
    for (const p of s.raw) { const q = toScr(p); ctx.fillRect(q.x - 0.75, q.y - 0.75, 1.5, 1.5); }
  }
  const sg = s.segs; if (!sg.length) return;
  ctx.strokeStyle = s.closed ? col('--close') : col('--pen'); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const p0 = toScr(sg[0]); ctx.moveTo(p0.x, p0.y);
  const n = s.closed ? sg.length : sg.length - 1;
  for (let i = 0; i < n; i++) {
    const a = sg[i], b = sg[(i + 1) % sg.length];
    const c1 = toScr({ x: a.x + a.ox, y: a.y + a.oy }), c2 = toScr({ x: b.x + b.ix, y: b.y + b.iy }), e = toScr(b);
    ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, e.x, e.y);
  }
  if (s.closed) { ctx.closePath(); ctx.globalAlpha = 0.08; ctx.fillStyle = col('--close'); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.stroke();
  // アンカー
  ctx.fillStyle = col('--ink');
  for (const a of sg) { const q = toScr(a); ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
}

// ---- 一筆：点を集める → 離したら閉じるか決める → ベジェにする ----
const CLOSE_PX = 10;        // 始点から画面で 10px 以内なら閉じる候補
const LEAVE_PX = 30;        // 一度は始点から 30px 以上離れた線だけを閉じる（タップや短い往復は閉じない）
const MIN_STEP_PX = 0.75;   // 直前の点から画面で 0.75px 未満の点は省く

function startStroke(e) {
  penId = e.pointerId;
  cur = { t0: e.timeStamp, tLast: e.timeStamp, events: 0, coalesced: 0, kept: 0, all: 0, raw: [], maxAway: 0, willClose: false,
    pMin: 1, pMax: 0, tiltMax: 0, type: e.pointerType };
  addPoint(e);
}
function addPoint(ev) {
  T.events++;
  const w = toWorld(ev.clientX, ev.clientY);
  if (cur.raw.length) {
    const last = toScr(cur.raw[cur.raw.length - 1]);
    if (Math.hypot(ev.clientX - last.x, ev.clientY - last.y) < MIN_STEP_PX) { cur.all++; return; }
  }
  cur.all++; cur.kept++;
  cur.raw.push({ x: w.x, y: w.y, p: ev.pressure });
  if (ev.pressure > 0 && ev.pressure !== 0.5) T.pressureSeen = true;
  cur.pMin = Math.min(cur.pMin, ev.pressure); cur.pMax = Math.max(cur.pMax, ev.pressure);
  const tilt = Math.max(Math.abs(ev.tiltX || 0), Math.abs(ev.tiltY || 0));
  if (tilt) T.tiltSeen = true;
  cur.tiltMax = Math.max(cur.tiltMax, tilt);
  const st = toScr(cur.raw[0]);
  const d = Math.hypot(ev.clientX - st.x, ev.clientY - st.y);
  cur.maxAway = Math.max(cur.maxAway, d);
  cur.willClose = cur.maxAway >= LEAVE_PX && d <= CLOSE_PX;
}
function moveStroke(e) {
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const evs = list && list.length ? list : [e];
  cur.events++; cur.coalesced += evs.length; T.coalesced += evs.length;
  T.coalescedMax = Math.max(T.coalescedMax, evs.length);
  for (const ev of evs) addPoint(ev);
  cur.tLast = e.timeStamp;
  requestDraw(); showNow(e);
}
function endStroke(e) {
  const s = cur; cur = null; penId = null;
  if (s.raw.length < 2) { requestDraw(); return; }
  const closed = s.willClose;
  const pts = s.raw.slice();
  if (closed && pts.length > 3) pts.pop();          // 始点に重なる終わりの点は外して、閉じた形として当てはめる
  const path = new paper.Path({ segments: pts.map((p) => [p.x, p.y]), insert: false });
  path.closed = closed;
  const tol = tolPx() / view.s;                       // 許容誤差（世界の単位）＝ 画面の px ÷ 倍率
  const t0 = performance.now();
  if (tol > 0) path.simplify(tol);
  const ms = performance.now() - t0;
  const segs = path.segments.map((g) => ({ x: g.point.x, y: g.point.y, ix: g.handleIn.x, iy: g.handleIn.y, ox: g.handleOut.x, oy: g.handleOut.y }));
  strokes.push({ raw: s.raw, segs, closed });
  T.strokes++; if (closed) T.closed++;
  const dur = (s.tLast - s.t0) / 1000;
  lastStroke = { type: s.type, closed, pts: s.all, kept: s.kept, anchors: segs.length, events: s.events,
    perEvent: s.events ? (s.coalesced / s.events).toFixed(1) : '-', hz: dur > 0 ? Math.round(s.all / dur) : '-',
    dur: dur.toFixed(2), pressure: `${s.pMin.toFixed(2)}〜${s.pMax.toFixed(2)}`, tilt: s.tiltMax, simplifyMs: ms.toFixed(1) };
  log(`一筆：${closed ? '閉じた' : '開いた'}線。点 ${s.all} → アンカー ${segs.length}`);
  showLast(); showTotal(); requestDraw();
}
function cancelStroke(why) {
  if (!cur) return;
  cur = null; penId = null; T.cancelled++;
  log(`描いている途中で中断（${why}）。その一筆は捨てました`, true);
  showTotal(); requestDraw();
}

// ---- 指：1本で動かす、2本で拡大・動かす ----
function rebaseGesture() {
  const ts = [...touches.values()];
  if (!ts.length) { gest = null; return; }
  const c = ts.length >= 2 ? { x: (ts[0].x + ts[1].x) / 2, y: (ts[0].y + ts[1].y) / 2 } : { x: ts[0].x, y: ts[0].y };
  const d = ts.length >= 2 ? Math.hypot(ts[0].x - ts[1].x, ts[0].y - ts[1].y) : 0;
  gest = { n: Math.min(ts.length, 2), c, d, s: view.s, tx: view.tx, ty: view.ty };
}
function moveGesture() {
  if (!gest) return;
  const ts = [...touches.values()];
  if (Math.min(ts.length, 2) !== gest.n) { rebaseGesture(); return; }   // 本数が変わったら基準を取り直す（画面が飛ばないように）
  const c = gest.n >= 2 ? { x: (ts[0].x + ts[1].x) / 2, y: (ts[0].y + ts[1].y) / 2 } : { x: ts[0].x, y: ts[0].y };
  let s = gest.s;
  if (gest.n >= 2 && gest.d > 0) s = Math.min(20, Math.max(0.1, gest.s * Math.hypot(ts[0].x - ts[1].x, ts[0].y - ts[1].y) / gest.d));
  // 基準の中心の下にあった世界の点が、いまの中心に来るように
  const wx = (gest.c.x - gest.tx) / gest.s, wy = (gest.c.y - gest.ty) / gest.s;
  view.s = s; view.tx = c.x - wx * s; view.ty = c.y - wy * s;
  requestDraw();
}
function dropAllTouches(why) {
  if (!touches.size) return;
  touches.clear(); gest = null;
  log(`指の操作を止めました（${why}）`);
}

// ---- Pointer Events ----
const isPenLike = (e) => e.pointerType === 'pen' || e.pointerType === 'mouse';   // パソコンで試せるようにマウスもペン扱い

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (isPenLike(e)) {
    if (penId !== null) return;                      // 2本目のペンは無視
    dropAllTouches('ペンが触れた');                   // ペンが来たら、進行中の指の操作をやめる
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    startStroke(e); showNow(e); requestDraw();
    return;
  }
  // 指・手のひら
  const w = e.width || 0;
  T.maxTouchW = Math.max(T.maxTouchW, Math.round(w));
  if (w >= 40) { T.bigTouch++; log(`大きい接触（幅 ${Math.round(w)}px）＝手のひらかも`); }
  if (penId !== null) { T.ignoredTouch++; log('ペンが触れている間の指・手のひらを無視'); showTotal(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY, w });
  T.maxTouches = Math.max(T.maxTouches, touches.size);
  if (touches.size === 1) T.fingerOps++;
  rebaseGesture(); showNow(e); showTotal(); requestDraw();
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId === penId && cur) { moveStroke(e); return; }
  const t = touches.get(e.pointerId);
  if (t) { t.x = e.clientX; t.y = e.clientY; t.w = e.width || t.w; moveGesture(); showNow(e); }
});
function up(e, cancelled) {
  if (e.pointerId === penId) { cancelled ? cancelStroke(e.type) : endStroke(e); return; }
  if (touches.delete(e.pointerId)) { if (cancelled) log(`指の操作が中断（${e.type}）`); rebaseGesture(); requestDraw(); }
}
cv.addEventListener('pointerup', (e) => up(e, false));
cv.addEventListener('pointercancel', (e) => up(e, true));
cv.addEventListener('lostpointercapture', (e) => { if (e.pointerId === penId && cur) cancelStroke('lostpointercapture'); });
// アプリを切り替えた・画面が隠れた
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelStroke('画面が隠れた'); dropAllTouches('画面が隠れた'); } });

// ページそのものの拡大・スクロール・長押しメニューを止める（Safari）
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, (e) => { e.preventDefault(); T.pageZoom++; }, { passive: false });
document.addEventListener('touchmove', (e) => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
// ページの拡大率が変わっていないか（1 のはず）
if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (Math.abs(visualViewport.scale - 1) > 0.01) log(`ページが拡大された（${visualViewport.scale.toFixed(2)} 倍）`, true); showEnv(); });

// ---- 表 ----
const rows = (o) => Object.entries(o).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
function showNow(e) {
  $('now').innerHTML = rows({
    種類: { pen: 'ペン', touch: '指・手のひら', mouse: 'マウス' }[e.pointerType] || e.pointerType,
    'pointerId / 主': `${e.pointerId} / ${e.isPrimary ? 'はい' : 'いいえ'}`,
    筆圧: (e.pressure ?? 0).toFixed(3),
    '傾き X / Y': `${e.tiltX ?? '-'}° / ${e.tiltY ?? '-'}°`,
    '高度 / 方位': e.altitudeAngle != null ? `${(e.altitudeAngle * 180 / Math.PI).toFixed(0)}° / ${((e.azimuthAngle || 0) * 180 / Math.PI).toFixed(0)}°` : '取れない',
    '接触の幅 × 高さ': `${(e.width || 0).toFixed(0)} × ${(e.height || 0).toFixed(0)} px`,
    触れている指: touches.size,
    表示の倍率: view.s.toFixed(2),
  });
}
function showLast() {
  if (!lastStroke) return;
  const l = lastStroke;
  $('last').innerHTML = rows({
    閉じたか: l.closed ? '閉じた' : '開いた',
    '点の数（省いた後）': `${l.pts}（${l.kept}）`,
    ベジェのアンカー: l.anchors,
    'イベント / 1回の点': `${l.events} / ${l.perEvent}`,
    '1秒あたりの点': l.hz,
    描いた時間: `${l.dur} 秒`,
    筆圧の幅: l.pressure,
    傾きの最大: `${l.tilt}°`,
    'ベジェ化の時間': `${l.simplifyMs} ms`,
  });
}
function showTotal() {
  $('total').innerHTML = rows({
    '一筆（閉じた）': `${T.strokes}（${T.closed}）`,
    中断した一筆: T.cancelled,
    'ペン中に無視した指': T.ignoredTouch,
    '大きい接触 / 最大の幅': `${T.bigTouch} / ${T.maxTouchW}px`,
    '指の操作 / 同時の最大': `${T.fingerOps} / ${T.maxTouches}本`,
    '1回のイベントの点（最大）': T.coalescedMax,
    筆圧が取れたか: T.pressureSeen ? 'はい' : 'まだ',
    傾きが取れたか: T.tiltSeen ? 'はい' : 'まだ',
    ページ拡大の動作を止めた回数: T.pageZoom,
  });
}
function standalone() { return !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); }
function safeArea() {
  const p = document.createElement('div');
  p.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(p);
  const s = getComputedStyle(p); const v = [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft].map((x) => parseFloat(x) || 0);
  p.remove(); return v.join(' / ');
}
function envInfo() {
  return {
    ホーム画面から: standalone() ? 'はい（全画面）' : 'いいえ（Safari の中）',
    画面の大きさ: `${innerWidth} × ${innerHeight}（${innerWidth > innerHeight ? '横' : '縦'}）`,
    devicePixelRatio: window.devicePixelRatio,
    'セーフエリア 上/右/下/左': safeArea(),
    同時タッチの最大: navigator.maxTouchPoints,
    getCoalescedEvents: 'getCoalescedEvents' in PointerEvent.prototype ? '使える' : '使えない',
    showSaveFilePicker: window.showSaveFilePicker ? '使える' : '使えない（ダウンロードで保存）',
    HTTPS: location.protocol === 'https:' ? 'はい' : 'いいえ',
    ブラウザ: navigator.userAgent,
  };
}
function showEnv() { $('env').innerHTML = rows(envInfo()); }

// ---- ボタン ----
$('tol').addEventListener('input', () => { $('tolv').textContent = $('tol').value; });
$('clear').onclick = () => { strokes.length = 0; lastStroke = null; $('last').innerHTML = ''; requestDraw(); };
$('raw').onclick = () => { showRaw = !showRaw; $('raw').textContent = `元の点：${showRaw ? '表示' : '隠す'}`; requestDraw(); };
$('reset').onclick = () => { view.s = 1; view.tx = 0; view.ty = 0; requestDraw(); };
$('hide').onclick = () => { const m = $('info').classList.toggle('min'); $('hide').textContent = m ? '広げる' : '小さく'; };

// 保存：アプリ本体（js/io/files.js）と同じやり方。showSaveFilePicker があれば使い、なければダウンロード
$('save').onclick = async () => {
  const text = JSON.stringify({ test: 'ipad-input', version: 1, saved: new Date().toISOString(), strokes: strokes.map((s) => ({ closed: s.closed, segs: s.segs })) });
  const name = 'ipad-test.icad';
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'イラレCAD', accept: { 'application/json': ['.icad'] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close();
      log(`保存しました（showSaveFilePicker）：一筆 ${strokes.length}`); return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    log(`ダウンロードで保存しました：一筆 ${strokes.length}（「ファイル」アプリに入ったか確かめてください）`);
  } catch (err) { log(`保存できませんでした：${err.name || err}`, true); }
};
$('load').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.test !== 'ipad-input') throw new Error('このテストで保存したファイルではありません');
    strokes.length = 0;
    for (const s of d.strokes) strokes.push({ raw: [], segs: s.segs, closed: s.closed });
    log(`読み込みました：${f.name}、一筆 ${strokes.length}`); requestDraw();
  } catch (err) { log(`読み込めませんでした：${err.message || err}`, true); }
});

// 結果をコピー：Claude に貼ってもらう用
$('copy').onclick = async () => {
  const lines = ['# iPad 入力テスト v1 の結果', `日時：${new Date().toLocaleString()}`, ''];
  const add = (title, o) => { lines.push(`## ${title}`); for (const [k, v] of Object.entries(o)) lines.push(`- ${k}：${v}`); lines.push(''); };
  add('この端末', envInfo());
  add('合計', {
    一筆: T.strokes, 閉じた一筆: T.closed, 中断した一筆: T.cancelled, ペン中に無視した指: T.ignoredTouch,
    大きい接触: T.bigTouch, 接触の幅の最大: `${T.maxTouchW}px`, 指の同時の最大: T.maxTouches,
    '1回のイベントの点（最大）': T.coalescedMax, 筆圧: T.pressureSeen ? '取れた' : '取れていない', 傾き: T.tiltSeen ? '取れた' : '取れていない',
    ページ拡大の動作を止めた回数: T.pageZoom, なめらかさ: `${tolPx()}px`,
  });
  if (lastStroke) add('最後の一筆', lastStroke);
  lines.push('## できごと'); for (const d of [...$('log').children].reverse()) lines.push(`- ${d.textContent}`);
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); log('結果をコピーしました'); }
  catch (_) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); log(ok ? '結果をコピーしました' : 'コピーできませんでした', !ok);
  }
};

resize(); showTotal();
log('ペンで描く、指 1 本で動かす、2 本で拡大。手のひらを置いたまま描いてみてください');
</script>
</body>
</html>
