<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イラレCAD 手描き</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header id="topbar">
  <div class="brand">イラレCAD <span class="ver">手描き 試作</span> <span class="ver vnum" id="appVer"></span></div>
  <div class="menu">
    <button data-cmd="new">新規</button>
    <button data-cmd="open" title="Ctrl+O">開く</button>
    <button data-cmd="save" title="Ctrl+S">保存</button>
    <button data-cmd="saveAs" title="Ctrl+Shift+S">別名で保存</button>
    <button data-cmd="exportSvg" title="Ctrl+Alt+E　イラレで開ける SVG にする">SVG書き出し</button>
    <button data-cmd="exportStl" title="3D プリンター用（単位 mm）。選んだ立体だけ、選んでいなければ全部">STL書き出し</button>
    <span class="sep"></span>
    <div class="mwrap"><button data-menu="object">オブジェクト ▾</button><div class="dropdown" id="menu-object" hidden></div></div>
    <div class="mwrap"><button data-menu="view">表示 ▾</button><div class="dropdown" id="menu-view" hidden></div></div>
    <span class="sep"></span>
    <button data-cmd="undo" id="btnUndo" title="Ctrl+Z">元に戻す</button>
    <button data-cmd="redo" id="btnRedo" title="Ctrl+Shift+Z">やり直し</button>
    <button data-cmd="outline" id="btnOutline" title="Ctrl+Y">アウトライン</button>
    <span id="zoomLabel">100%</span>
  </div>
  <div class="right">
    <span id="fileName"></span>
    <button data-cmd="prefs" title="Ctrl+K">環境設定</button>
    <button data-cmd="help" title="F1">ショートカット一覧</button>
  </div>
</header>

<nav id="toolbar">
  <button data-tool="select" title="選択ツール (V)　ダブルクリックで「移動」"><svg viewBox="0 0 20 20"><path d="M5 2v15l4-4 3 6 2.2-1-3-6H17z" fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
  <button data-tool="direct" title="ダイレクト選択ツール (A)"><svg viewBox="0 0 20 20"><path d="M5 2v15l4-4 3 6 2.2-1-3-6H17z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
  <div class="tsep"></div>
  <button data-tool="pen" title="ペンツール (P)"><svg viewBox="0 0 20 20"><path d="M10 2l5 8-3 6H8l-3-6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 2v6.6" stroke="currentColor" stroke-width="1.2"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><path d="M7.5 18.2h5" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button data-tool="addAnchor" title="アンカーポイントの追加ツール (+)"><svg viewBox="0 0 20 20"><path d="M8 3l4 6.5-2.4 5H6.4L4 9.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M14 13v6M11 16h6" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button data-tool="deleteAnchor" title="アンカーポイントの削除ツール (-)"><svg viewBox="0 0 20 20"><path d="M8 3l4 6.5-2.4 5H6.4L4 9.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11 16h6" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button data-tool="convert" title="アンカーポイントツール (Shift+C)"><svg viewBox="0 0 20 20"><path d="M3 15L10 5l7 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><rect x="8.5" y="3.5" width="3" height="3" fill="currentColor"/></svg></button>
  <div class="tsep"></div>
  <button data-tool="rect" data-group="rect" class="grp" title="長方形ツール (M)　長押しでほかのツール"><svg viewBox="0 0 20 20"><rect x="3.5" y="5" width="13" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button data-tool="ellipse" title="楕円形ツール (L)"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="6.5" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button data-tool="line" title="直線ツール (\)"><svg viewBox="0 0 20 20"><path d="M4 16L16 4" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button data-tool="dim" title="寸法ツール　クリック 2 回で 2 点、3 回目で寸法線の位置"><svg viewBox="0 0 20 20"><path d="M3 5v10M17 5v10" stroke="currentColor" stroke-width="1.2"/><path d="M3 12h14" stroke="currentColor" stroke-width="1.2"/><path d="M3 12l3-1.6v3.2zM17 12l-3-1.6v3.2z" fill="currentColor"/><path d="M8 8.5h4" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <div class="tsep"></div>
  <button data-tool="rotate" title="回転ツール (R)　Alt+クリック・ダブルクリックで数値入力"><svg viewBox="0 0 20 20"><path d="M15.6 7.5A6 6 0 1 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16.4 3.4v4.4H12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button data-tool="reflect" title="リフレクトツール（折り返し）(O)　Alt+クリック・ダブルクリックで数値入力"><svg viewBox="0 0 20 20"><path d="M10 2v16" stroke="currentColor" stroke-width="1" stroke-dasharray="2 1.5"/><path d="M8 5L3 15h5z" fill="currentColor"/><path d="M12 5l5 10h-5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
  <button data-tool="scale" title="拡大・縮小ツール (S)　Alt+クリック・ダブルクリックで数値入力"><svg viewBox="0 0 20 20"><rect x="3" y="9" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="3" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 1.5"/><path d="M11 9l5-5M12.5 4H16v3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
  <button data-tool="eyedropper" title="スポイトツール (I)"><svg viewBox="0 0 20 20"><path d="M12.5 4.5l3 3M11 6l3 3-7 7H5v-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 3.5l1.5-1.5 4.5 4.5-1.5 1.5" fill="currentColor" stroke="currentColor" stroke-width="1"/></svg></button>
  <button data-tool="hand" title="手のひらツール (H)"><svg viewBox="0 0 20 20"><path d="M6.5 11V6.2a1.2 1.2 0 0 1 2.4 0V10V4.4a1.2 1.2 0 0 1 2.4 0V10V5.4a1.2 1.2 0 0 1 2.4 0V11V7.6a1.2 1.2 0 0 1 2.4 0V13c0 3-2 5-5 5-2.3 0-3.6-1-4.6-2.6L4 12.6a1.2 1.2 0 0 1 2-1.3z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
  <button data-tool="zoom" title="ズームツール (Z)"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.2 12.2L17 17" stroke="currentColor" stroke-width="2"/></svg></button>

  <div id="colorWell" title="塗りと線（X で切り替え）">
    <div id="swStroke" class="swatch stroke" title="線（クリックで選ぶ／もう一度で色を選ぶ）"></div>
    <div id="swFill" class="swatch fill" title="塗り（クリックで選ぶ／もう一度で色を選ぶ）"></div>
  </div>
  <div class="wellBtns">
    <button id="btnDefault" title="初期設定の塗りと線 (D)"><svg viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="3" width="8" height="8" fill="#fff" stroke="#000"/></svg></button>
    <button id="btnSwap" title="塗りと線を入れ替え (Shift+X)"><svg viewBox="0 0 20 20"><path d="M5 14V7a2 2 0 0 1 2-2h7M12 2.5L14.5 5 12 7.5M2.5 12L5 14.5 7.5 12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button id="btnNone" title="なし (/)"><svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" fill="#fff" stroke="#888"/><path d="M4 16L16 4" stroke="#e33" stroke-width="2"/></svg></button>
  </div>
</nav>

<main id="stageWrap">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg">
    <g id="world">
      <rect id="board" x="0" y="0" fill="#fff"/>
      <g id="grid"></g>
      <rect id="boardEdge" x="0" y="0" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1" vector-effect="non-scaling-stroke" pointer-events="none"/>
      <g id="art"></g>
    </g>
    <g id="overlay" pointer-events="none"></g>
  </svg>
  <canvas id="rulerTop" class="ruler"></canvas>
  <canvas id="rulerLeft" class="ruler"></canvas>
  <div id="rulerCorner" class="ruler"></div>
</main>

<aside id="views" title="正面図・側面図（平面図で押し出したパスが、ここに立体で出ます）">
  <div id="viewFront" class="view3d"><canvas></canvas><div class="vlabel">正面図</div><svg class="vover" xmlns="http://www.w3.org/2000/svg"></svg><div class="vhint"></div><div class="vtip" hidden></div></div>
  <div id="viewSide" class="view3d"><canvas></canvas><div class="vlabel">側面図</div><svg class="vover" xmlns="http://www.w3.org/2000/svg"></svg><div class="vhint"></div><div class="vtip" hidden></div></div>
  <div id="splitV" class="split v" title="ドラッグで平面図と正面図・側面図の幅を変える（ダブルクリックで元に戻す）"></div>
  <div id="splitH" class="split h" title="ドラッグで正面図と側面図の高さを変える（ダブルクリックで元に戻す）"></div>
</aside>

<aside id="panels">
  <section>
    <h2>塗りと線</h2>
    <div class="row"><label>塗り</label><input type="color" id="inFill"><button id="fillNone" class="small">なし</button></div>
    <div class="row"><label>線</label><input type="color" id="inStroke"><button id="strokeNone" class="small">なし</button></div>
    <div class="row"><label>線幅</label><input type="number" id="inSw" min="0" step="0.05"><span class="unit" id="swUnit">mm</span></div>
  </section>
  <section>
    <h2>変形 <span class="note">左上基準・mm</span></h2>
    <div class="grid2">
      <label>X</label><input type="number" id="inX" step="any">
      <label>Y</label><input type="number" id="inY" step="any">
      <label>W</label><input type="number" id="inW" step="any">
      <label>H</label><input type="number" id="inH" step="any">
    </div>
  </section>
  <section>
    <h2>3D 押し出し <span class="note">mm</span></h2>
    <div class="grid2 ex3d">
      <label title="押し出す高さ">高さ</label><input type="number" id="inExH" step="any" min="0">
      <label title="底の高さ（床からどれだけ浮かせるか）">底</label><input type="number" id="inExZ" step="any">
    </div>
    <div class="row ex3dBtns">
      <button id="btnExtrude" title="選んだ閉じたパスを押し出す">押し出す</button>
      <button id="btnUnextrude" title="押し出しをやめて、平らなパスに戻す">解除</button>
    </div>
  </section>
  <section>
    <h2>折りたたみ <span class="note">試作</span></h2>
    <div class="grid2 ex3d">
      <label title="選んだ面を、つながっている面に対して何度起こすか（上へ ＋）">角度 °</label><input type="number" id="inFoldDeg" step="any" min="-180" max="180">
    </div>
    <div class="row ex3dBtns">
      <button id="btnFold90" title="選んだ面を 90° 起こす">90°</button>
      <button id="btnFold0" title="選んだ面を開く（0°）">開く</button>
      <button id="btnUnfoldAll" title="全部の面を開いて、展開図に戻す">全部開く</button>
    </div>
    <div class="row ex3dBtns">
      <button id="btnPlanFolded" title="平面図を、展開図か、組み立てた形（真上から見たところ）か切り替える">平面図：展開図</button>
    </div>
    <div class="note" id="foldNote"></div>
  </section>
  <section>
    <h2>整列
      <select id="alignTo" title="整列の基準">
        <option value="selection">選択範囲に整列</option>
        <option value="key">キーオブジェクトに整列</option>
        <option value="artboard">アートボードに整列</option>
      </select>
    </h2>
    <div class="pfLabel">オブジェクトの整列</div>
    <div class="pfRow al">
      <button data-align="left" title="水平方向左に整列"><svg viewBox="0 0 24 24"><path d="M3 2v20" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="5" width="14" height="5" fill="currentColor"/><rect x="5" y="14" width="9" height="5" fill="currentColor"/></svg></button>
      <button data-align="hcenter" title="水平方向中央に整列"><svg viewBox="0 0 24 24"><path d="M12 2v20" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="5" width="16" height="5" fill="currentColor" opacity=".85"/><rect x="7" y="14" width="10" height="5" fill="currentColor" opacity=".85"/></svg></button>
      <button data-align="right" title="水平方向右に整列"><svg viewBox="0 0 24 24"><path d="M21 2v20" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="5" width="14" height="5" fill="currentColor"/><rect x="10" y="14" width="9" height="5" fill="currentColor"/></svg></button>
      <button data-align="top" title="垂直方向上に整列"><svg viewBox="0 0 24 24"><path d="M2 3h20" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="5" width="5" height="14" fill="currentColor"/><rect x="14" y="5" width="5" height="9" fill="currentColor"/></svg></button>
      <button data-align="vcenter" title="垂直方向中央に整列"><svg viewBox="0 0 24 24"><path d="M2 12h20" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="4" width="5" height="16" fill="currentColor" opacity=".85"/><rect x="14" y="7" width="5" height="10" fill="currentColor" opacity=".85"/></svg></button>
      <button data-align="bottom" title="垂直方向下に整列"><svg viewBox="0 0 24 24"><path d="M2 21h20" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="5" width="5" height="14" fill="currentColor"/><rect x="14" y="10" width="5" height="9" fill="currentColor"/></svg></button>
    </div>
    <div class="pfLabel">オブジェクトの分布</div>
    <div class="pfRow al">
      <button data-dist="top" title="垂直方向上に分布"><svg viewBox="0 0 24 24"><path d="M2 3h20M2 13h20" stroke="currentColor" stroke-width="1.2"/><rect x="4" y="3" width="6" height="7" fill="currentColor"/><rect x="14" y="13" width="6" height="7" fill="currentColor"/></svg></button>
      <button data-dist="vcenter" title="垂直方向中央に分布"><svg viewBox="0 0 24 24"><path d="M2 6.5h20M2 16.5h20" stroke="currentColor" stroke-width="1.2"/><rect x="4" y="3" width="6" height="7" fill="currentColor" opacity=".85"/><rect x="14" y="13" width="6" height="7" fill="currentColor" opacity=".85"/></svg></button>
      <button data-dist="bottom" title="垂直方向下に分布"><svg viewBox="0 0 24 24"><path d="M2 10h20M2 20h20" stroke="currentColor" stroke-width="1.2"/><rect x="4" y="3" width="6" height="7" fill="currentColor"/><rect x="14" y="13" width="6" height="7" fill="currentColor"/></svg></button>
      <button data-dist="left" title="水平方向左に分布"><svg viewBox="0 0 24 24"><path d="M3 2v20M13 2v20" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="4" width="7" height="6" fill="currentColor"/><rect x="13" y="14" width="7" height="6" fill="currentColor"/></svg></button>
      <button data-dist="hcenter" title="水平方向中央に分布"><svg viewBox="0 0 24 24"><path d="M6.5 2v20M16.5 2v20" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="4" width="7" height="6" fill="currentColor" opacity=".85"/><rect x="13" y="14" width="7" height="6" fill="currentColor" opacity=".85"/></svg></button>
      <button data-dist="right" title="水平方向右に分布"><svg viewBox="0 0 24 24"><path d="M10 2v20M20 2v20" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="4" width="7" height="6" fill="currentColor"/><rect x="13" y="14" width="7" height="6" fill="currentColor"/></svg></button>
    </div>
    <div class="pfLabel">等間隔に分布</div>
    <div class="pfRow al">
      <button data-space="v" title="垂直方向等間隔に分布"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="5" fill="currentColor"/><rect x="5" y="17" width="14" height="5" fill="currentColor"/><path d="M12 8v8M9 10l3-2 3 2M9 14l3 2 3-2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button data-space="h" title="水平方向等間隔に分布"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="5" height="14" fill="currentColor"/><rect x="17" y="5" width="5" height="14" fill="currentColor"/><path d="M8 12h8M10 9l-2 3 2 3M14 9l2 3-2 3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <input type="number" id="inGap" value="0" step="any" title="間隔（キーオブジェクトに整列のとき使います）"><span class="unit">mm</span>
    </div>
  </section>
  <section>
    <h2>パスファインダー <button id="btnOffset" class="small" title="オブジェクト → パス → パスのオフセット">パスのオフセット…</button></h2>
    <div class="pfLabel">形状モード</div>
    <div class="pfRow">
      <button data-pf="unite" title="合体"><svg viewBox="0 0 24 24"><path d="M3 3h11v5h7v13H8v-5H3z" fill="currentColor"/></svg></button>
      <button data-pf="minusFront" title="前面オブジェクトで型抜き"><svg viewBox="0 0 24 24"><path d="M3 3h11v5H8v8H3z" fill="currentColor"/><rect x="8.5" y="8.5" width="12" height="12" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/></svg></button>
      <button data-pf="intersect" title="交差"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="10.5" height="12" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/><rect x="8.5" y="8.5" width="12" height="12" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/><rect x="8" y="8" width="6" height="8" fill="currentColor"/></svg></button>
      <button data-pf="exclude" title="中マド"><svg viewBox="0 0 24 24"><path d="M3 3h11v5H8v8H3zM14 8h7v13H8v-5h6z" fill="currentColor"/></svg></button>
    </div>
    <div class="pfLabel">パスファインダー</div>
    <div class="pfRow">
      <button data-pf="divide" title="分割"><svg viewBox="0 0 24 24"><path d="M3 3h11v4.5H7.5V16H3z" fill="currentColor"/><path d="M8.5 8.5h5v7h-5z" fill="currentColor" opacity=".55"/><path d="M14.5 8h6.5v13H8v-4.5h6.5z" fill="currentColor"/></svg></button>
      <button data-pf="trim" title="刈り込み"><svg viewBox="0 0 24 24"><path d="M3 3h11v5H8v8H3z" fill="currentColor"/><rect x="8" y="8" width="13" height="13" fill="currentColor" opacity=".55"/></svg></button>
      <button data-pf="minusBack" title="背面オブジェクトで型抜き"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="10.5" height="12" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/><path d="M14 8h7v13H8v-5h6z" fill="currentColor"/></svg></button>
    </div>
  </section>
  <section>
    <h2>図面 <span class="note">寸法・三面図は図面レイヤーへ</span></h2>
    <div class="row"><button id="btnSheet" class="small">三面図の紙を作る</button></div>
    <div class="grid2" id="sheetOpts">
      <label>用紙</label><select id="sheetSize"><option value="A4">A4 横</option><option value="A3">A3 横</option></select>
      <label>尺度</label><select id="sheetScale"><option value="auto">自動</option><option value="2">2:1</option><option value="1">1:1</option><option value="0.5">1:2</option><option value="0.2">1:5</option><option value="0.1">1:10</option><option value="0.05">1:20</option></select>
    </div>
  </section>
  <section>
    <h2>アートボード <span class="note">mm</span></h2>
    <div class="grid2">
      <label>幅</label><input type="number" id="inBW" step="any" min="1">
      <label>高さ</label><input type="number" id="inBH" step="any" min="1">
    </div>
  </section>
  <section class="grow">
    <h2>レイヤー
      <span class="hbtns">
        <button id="layerAdd" title="新規レイヤー">＋</button>
        <button id="layerUp" title="上へ">▲</button>
        <button id="layerDown" title="下へ">▼</button>
        <button id="layerDel" title="レイヤーを削除">削除</button>
      </span>
    </h2>
    <ul id="layerList"></ul>
    <p class="note">名前はダブルクリックで変更</p>
  </section>
</aside>

<footer id="status">
  <span id="stTool"></span>
  <span id="stHint"></span>
  <span id="stFlags"></span>
  <span id="stPos"></span>
</footer>

<div id="help" class="modal" hidden>
  <div class="modalBox">
    <div class="modalHead"><h2>ショートカット一覧</h2><button id="helpClose">閉じる (Esc)</button></div>
    <div id="helpBody"></div>
  </div>
</div>
<div id="dialog" class="modal" hidden>
  <div class="modalBox dlg">
    <div class="modalHead"><h2 id="dlgTitle"></h2></div>
    <div id="dlgBody"></div>
    <div class="dlgFoot">
